<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<meta name="referrer" content="no-referrer">
<title>Cork7 Proxy · Website Switcher</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#101820;--line:rgba(182,231,220,.16);--muted:#8fa2ad;--text:#edf3f7;--mint:#b6e7dc}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:66px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(10,16,22,.97)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:38px;height:38px;display:grid;place-items:center;flex:none;border:1px solid rgba(182,231,220,.38);border-radius:11px;background:rgba(91,151,143,.1);color:var(--mint);font-weight:900;letter-spacing:-.08em}
.brand-title{font-size:13px;font-weight:850;letter-spacing:.08em}
.brand-sub{margin-top:3px;color:var(--muted);font-size:10px}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
button,.open-link{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#121e26;color:#d8e5e9;font:inherit;font-size:12px;font-weight:750;text-decoration:none;cursor:pointer}
button:hover,.open-link:hover{border-color:rgba(182,231,220,.55)}
button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#071010}
.open-link{display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
main{position:relative;flex:1;min-height:0;background:#030609}
iframe{display:block;width:100%;height:100%;border:0;background:#030609}
.status{position:absolute;left:12px;bottom:12px;z-index:1;padding:7px 10px;border:1px solid rgba(182,231,220,.16);border-radius:8px;background:rgba(5,10,14,.82);color:#a9bbc2;font-size:10px;pointer-events:none}
@media(max-width:620px){header{align-items:flex-start;padding:10px;flex-direction:column}.controls{width:100%;justify-content:flex-start}.brand-sub{font-size:9px}button,.open-link{min-height:36px;padding:0 11px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">C7</div>
    <div><div class="brand-title">CORK-7 PROXY</div><div class="brand-sub">Choose which website to open</div></div>
  </div>
  <nav class="controls" aria-label="Website selector">
    <button id="cork7Button" type="button" aria-pressed="true">Cork7</button>
    <button id="saltyseasButton" type="button" aria-pressed="false">Saltyseas</button>
    <a id="openLink" class="open-link" href="/player/" target="_blank" rel="noopener noreferrer">Open in new tab ↗</a>
  </nav>
</header>
<main>
  <iframe id="siteFrame" title="Selected website" src="/player/" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>
  <div class="status" id="status" aria-live="polite">Current website: Cork7</div>
</main>
<script>
(() => {
  const destinations = {
    cork7: { url: "/player/", label: "Cork7" },
    saltyseas: { url: "https://saltyseas.io/app/", label: "Saltyseas" }
  };
  const frame = document.getElementById("siteFrame");
  const cork7Button = document.getElementById("cork7Button");
  const saltyseasButton = document.getElementById("saltyseasButton");
  const openLink = document.getElementById("openLink");
  const status = document.getElementById("status");

  function selectSite(site, save = true) {
    const destination = destinations[site] || destinations.cork7;
    frame.src = destination.url;
    openLink.href = destination.url;
    cork7Button.setAttribute("aria-pressed", String(site === "cork7"));
    saltyseasButton.setAttribute("aria-pressed", String(site === "saltyseas"));
    status.textContent = "Current website: " + destination.label;
    if (save) {
      try { localStorage.setItem("cork7-proxy-selected-site", site); } catch {}
    }
  }

  cork7Button.addEventListener("click", () => selectSite("cork7"));
  saltyseasButton.addEventListener("click", () => selectSite("saltyseas"));

  let initial = "cork7";
  try {
    const saved = localStorage.getItem("cork7-proxy-selected-site");
    if (saved === "saltyseas" || saved === "cork7") initial = saved;
  } catch {}
  selectSite(initial, false);
})();
</script>
</body>
</html>
