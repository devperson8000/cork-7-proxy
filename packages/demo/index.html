<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="%BASE_URL%icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#080b10" />
		<meta name="color-scheme" content="dark" />
		<meta name="referrer" content="no-referrer" />
		<title>Cork7 Game Player</title>
		<style>
			:root { color-scheme: dark; background: #080b10; }
			* { box-sizing: border-box; }
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: #080b10;
				color: #edf3f7;
			}
			body { min-width: 320px; }
			#app { width: 100%; height: 100%; min-height: 100%; }
			.player-fatal {
				display: grid;
				width: 100%;
				height: 100%;
				place-items: center;
				padding: 24px;
				background: #080b10;
				color: #dce9eb;
				font: 600 14px/1.5 system-ui, sans-serif;
				text-align: center;
			}
		</style>
		<script src="%BASE_URL%scramjet/scramjet.js"></script>
		<script src="%BASE_URL%controller/controller.api.js"></script>
	</head>
	<body>
		<div id="app">
			<main class="player-fatal">Preparing your Cork7 game session…</main>
		</div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
