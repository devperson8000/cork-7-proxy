name: Export repository ZIP

on:
  push:
    branches:
      - feature/cork7-browser-agent-rework
    paths:
      - ".github/workflows/export-repository-zip.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create full repository archive
        shell: bash
        run: |
          git archive --format=zip --prefix=cork-7-proxy/ HEAD -o "$RUNNER_TEMP/cork-7-proxy.zip"
          test -s "$RUNNER_TEMP/cork-7-proxy.zip"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: cork-7-proxy-source
          path: ${{ runner.temp }}/cork-7-proxy.zip
          if-no-files-found: error
          retention-days: 1
