<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Cork7 Game</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b10; color: #edf3f7; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 50% 38%, rgba(51, 105, 107, .19), transparent 42%), #080b10; }
      main { width: min(100%, 440px); text-align: center; }
      .mark { display: grid; width: 58px; height: 58px; margin: 0 auto 24px; place-items: center; border: 1px solid rgba(151, 215, 203, .42); border-radius: 17px; background: rgba(91, 151, 143, .1); color: #b6e7dc; font-size: 20px; font-weight: 850; letter-spacing: -.08em; }
      h1 { margin: 0; font-size: clamp(30px, 8vw, 42px); letter-spacing: -.055em; }
      p { margin: 12px 0 28px; color: #91a1ad; font-size: 14px; line-height: 1.65; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid rgba(157, 220, 208, .4); border-radius: 11px; background: #b6e7dc; color: #071010; font-size: 13px; font-weight: 800; text-decoration: none; transition: transform .16s ease, background .16s ease; }
      a:hover { transform: translateY(-1px); background: #d0f5ec; }
      a:focus-visible { outline: 2px solid #b6e7dc; outline-offset: 4px; }
      .hint { display: block; margin-top: 18px; color: #687987; font-size: 11px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">C7</div>
      <h1>Cork7</h1>
      <p>Your game player is ready. Open the player to start a session.</p>
      <a href="/c7">Launch game</a>
      <span class="hint">Cork7 Game Player</span>
    </main>
  </body>
</html>
